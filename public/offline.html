<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" />
    <title>You are offline — subsel</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf8f5; color: #1c1917;
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 28px; letter-spacing: -0.03em; font-weight: 500; margin: 20px 0 8px; }
      p { color: #78716c; line-height: 1.5; margin: 0 0 24px; }
      button { background: #1c1917; color: #fff; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Check your connection. Your bag and orders are saved and will be here when you are back.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
